[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "pandoc-latex-tip"
description = "A pandoc filter for adding icons on specific elements"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = { text = "BSD-3-Clause" }
license-files = { paths = ["LICENSE"] }
authors = [{ name = "Christophe Demko", email = "chdemko@gmail.com" }]
maintainers = [{ name = "Christophe Demko", email = "chdemko@gmail.com" }]
keywords = ["pandoc", "filters", "latex", "tip", "Font-Awesome", "icon"]
classifiers = [
  # How mature is this project? Common values are
  # 3 - Alpha
  # 4 - Beta
  # 5 - Production/Stable
  "Development Status :: 5 - Production/Stable",
  # Specify the OS
  "Operating System :: OS Independent",
  # Indicate who your project is intended for
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Filters",
  # Specify the Python versions you support here. In particular, ensure
  # that you indicate whether you support Python 2, Python 3 or both.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  # Natural language used
  "Natural Language :: English"
]
dependencies = [
  "panflute~=2.3",
  "pillow~=13.0",
  "fonttools[woff]~=4.68",
  "platformdirs~=4.14",
  "PyYAML~=6.0",
  "tinycss2~=1.5",
  "click~=8.5"
]

[project.urls]
Homepage = "https://github.com/chdemko/pandoc-latex-tip"
Documentation = "https://pandoc-latex-tip.readthedocs.io/"
Repository = "https://github.com/chdemko/pandoc-latex-tip"
Issues = "https://github.com/chdemko/pandoc-latex-tip/issues"
Coverage = "https://coveralls.io/github/chdemko/pandoc-latex-tip"

[project.scripts]
pandoc-latex-tip = "pandoc_latex_tip:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/pandoc_latex_tip"]

[tool.hatch.build.targets.wheel.shared-data]
share = "share"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.hatch-static-analysis]
dependencies = [
  # Types
  "types-PyYAML~=6.0",
  # Formatter
  "black[jupyter]~=26.10",
  # Style checkers
  "doc8~=2.0",
  "mypy~=2.4",
  "refurb~=2.3",
  "ruff~=0.17"
]

[tool.hatch.envs.hatch-static-analysis.scripts]
format-check = [
  "black --check --diff {args:src download.py docs}",
  "doc8 -q {args:docs README.md} -e .rst -e .md"
]
format-fix = [
  "black {args:src download.py docs}"
]
lint-check = [
  "refurb {args:src download.py docs}",
  "ruff check {args:src download.py docs}"
]
lint-fix = [
  "ruff check --fix {args:src download.py docs}"
]

[tool.hatch.envs.lint]
dependencies = [
  "slotscheck~=0.19",
  "pylint~=4.1"
]

[tool.hatch.envs.lint.scripts]
check = [
  "slotscheck {args:src}",
  "pylint {args:src download.py}"
]

[tool.hatch.envs.docs]
dependencies = [
  "myst-parser~=5.1",
  "Sphinx~=9.2",
  "sphinx-rtd-theme~=3.1",
  "sphinx-copybutton~=0.5"
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build docs {args:build/sphinx/html}"

[tool.ruff]
# Allow lines to be as long as 88.
line-length = 88

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["INP001"]
"tests/**/*.py" = ["T201"]

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
# equivalent to --strict option
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
mypy_path = "src"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "panflute.*"

[tool.coverage.run]
source = ["src"]
