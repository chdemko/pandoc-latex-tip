# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        pandoc-version: ['3.13']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Hatch
      run: |
        pipx install hatch
    - name: Install dependencies
      run: |
        wget https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc-version }}/pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        sudo dpkg -i ./pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        hatch run python download.py
    - name: Test
      run: |
        hatch test -py ${{ matrix.python-version }}

  pandoc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
        pandoc-version: [3.8.2.1, 3.9.0.2, 3.10.2, '3.11', 3.12.1, '3.13']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Hatch
      run: |
        pipx install hatch
    - name: Install dependencies
      run: |
        wget https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc-version }}/pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        sudo dpkg -i ./pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        hatch run python download.py
    - name: Test
      run: |
        hatch test

  style:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
        pandoc-version: ['3.13']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Hatch
      run: |
        pipx install hatch
    - name: Install dependencies
      run: |
        wget https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc-version }}/pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        sudo dpkg -i ./pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        hatch run python download.py
    - name: Static check
      run: |
        hatch check
    - name: Dynamic check
      run: |
        hatch run lint:check

  cov:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
        pandoc-version: ['3.13']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Hatch
      run: |
        pipx install hatch
    - name: Install dependencies
      run: |
        wget https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc-version }}/pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        sudo dpkg -i ./pandoc-${{ matrix.pandoc-version }}-1-amd64.deb
        hatch run python download.py
    - name: Test
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      run: |-
        hatch test --cover
        hatch run pip install coveralls
        hatch run coveralls
