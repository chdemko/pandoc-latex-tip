repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-toml
  - id: check-yaml

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --no-sort]
    exclude: ^uv\.lock$
  - id: pretty-format-yaml
    args: [--autofix]

- repo: https://github.com/asottile/pyupgrade
  rev: v3.22.0
  hooks:
  - id: pyupgrade
    args: [--py311-plus]

- repo: local
  hooks:
  - id: format
    name: format
    entry: hatch check
    language: system
    pass_filenames: false
  - id: lint
    name: lint
    entry: hatch run lint:check
    language: system
    pass_filenames: false
  - id: test
    name: test
    entry: hatch test
    language: system
    pass_filenames: false
  - id: lock
    name: lock
    entry: uv lock --upgrade
    language: system
    pass_filenames: false
